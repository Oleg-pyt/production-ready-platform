# ──────────────────────────────────────────────────────────────────────────────
# Production-ready platform
#
# Build pipeline (run once before docker compose up):
#   mvn -f pom.xml -DskipTests package
#
# CI pipeline (strict lockfile):
#   mvn -f pom.xml -P ci -DskipTests package
#
# The resulting backend/target/backend-*.jar contains:
#   ✔ Spring Boot backend
#   ✔ Generated Java API interfaces + DTOs  (api-java)
#   ✔ Angular frontend static files         (frontend → META-INF/resources)
#
# A single container serves both the REST API and the SPA on port 8080.
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16
    container_name: platform-postgres
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: platform-backend
    ports:
      - "8080:8080"   # REST API  → http://localhost:8080/api/*
                      # Angular   → http://localhost:8080/
                      # Swagger   → http://localhost:8080/swagger-ui/index.html
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
